services:
  - type: web
    name: nfl-pick-em-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKGROUND_JOBS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        value: https://nsljipyoihcoqkuphhll.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
    autoDeploy: false
    healthCheckPath: /api/health
