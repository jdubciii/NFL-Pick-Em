name: Build Android Release APK

on:
  push:
    branches:
      - feat/p37-shell-auth-openslate

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    if: github.ref == 'refs/heads/feat/p37-shell-auth-openslate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js for Capacitor 8
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Java for Android Gradle Plugin 8.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Build web client
        working-directory: client
        env:
          VITE_API_URL: https://nfl-pick-em-api.onrender.com
          VITE_SUPABASE_URL: https://nsljipyoihcoqkuphhll.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zbGppcHlvaWhjb3FrdXBoaGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTY3NDUsImV4cCI6MjEwNjEzMjc0NX0.OD0dom_H-n0cAPeQyngmUPJhrKNNr9G9m6DqpPsFGYw
          VITE_BASE_PATH: /
          VITE_GIT_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Assemble signed release APK
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          test -s client/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose client/android/app/build/outputs/apk/release/app-release.apk
          sha256sum client/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfl-pick-em-release-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
